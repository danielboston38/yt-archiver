[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tubevault"
version = "0.2.0"
description = "Archive and search YouTube channel metadata locally, with a web UI"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Mark", email = "mark@dymek.me"},
]
keywords = ["youtube", "archive", "search", "metadata", "yt-dlp"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Environment :: Console",
]
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.1.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "platformdirs>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/danielboston38/yt-archiver"
Repository = "https://github.com/danielboston38/yt-archiver"

[project.scripts]
tubevault = "tubevault.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tubevault*"]

[tool.setuptools.package-data]
tubevault = [
    "templates/*.html",
    "static/*.css",
    "static/*.js",
]
