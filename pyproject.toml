[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-archiver"
version = "0.2.0"
description = "Archive and search YouTube channel metadata locally, with a web UI"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.1.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "platformdirs>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/danielboston38/yt-archiver"
Repository = "https://github.com/danielboston38/yt-archiver"

[project.scripts]
yt-archiver = "yt_archiver.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["yt_archiver*"]

[tool.setuptools.package-data]
yt_archiver = [
    "templates/*.html",
    "static/*.css",
    "static/*.js",
]
